name: CI

# Rulează la fiecare push și pe fiecare PR. Fără asta, nimic nu garantează că
# ce ajunge pe `main` mai trece testele.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Un PR cu mai multe push-uri rapide: anulăm rulările vechi, păstrăm ultima.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres REAL în CI — testele rulează pe același motor ca producția (nu SQLite).
    # Motiv: bug-uri de foreign-key și de tip specifice Postgres treceau pe SQLite și
    # cădeau în producție. `TEST_DATABASE_URL` spune conftest-ului să folosească acest
    # serviciu (nu pornește un container testcontainers, mai lent).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flirt
          POSTGRES_PASSWORD: flirt
          POSTGRES_DB: flirt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flirt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalez dependențele (inclusiv extras `test`)
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Rulez testele
        # ENVIRONMENT=development ca guardrail-urile de producție din config.py să nu
        # ceară chei reale. TEST_DATABASE_URL → Postgres real (serviciul de mai sus).
        env:
          ENVIRONMENT: development
          TEST_DATABASE_URL: postgresql+asyncpg://flirt:flirt@localhost:5432/flirt_test
        run: python -m pytest -q

      - name: Verific config-ul nginx al imaginii flirt-web (șablon k8s → nginx -t)
        # Exact ce face podul `web` la pornire, în ACEEAȘI imagine de bază ca etapa
        # finală din Dockerfile: fișierele montate la căile din `COPY`, apoi
        # entrypoint-ul REAL (validare hostname + envsubst cu listă fixă + `nginx -t`),
        # cu `exec nginx ...` final înlocuit de `exit 0` (verificăm, nu pornim).
        # `--add-host api:127.0.0.1`: `upstream flirt_api` se rezolvă la încărcare,
        # iar în CI nu există Service-ul `api`. Fără TLS aici (îl termină Traefik).
        working-directory: deploy/k8s/images/web
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$(awk '$1 == "FROM" && $2 ~ /^nginxinc\// {print $2}' Dockerfile | tail -n1)"
          test -n "$IMAGE" || { echo "nu găsesc imaginea nginx de bază în Dockerfile"; exit 1; }

          mounts=()
          while read -r src dest; do
            mounts+=(-v "$GITHUB_WORKSPACE/$src:$dest:ro")
          done < <(awk '$1 == "COPY" && $2 ~ /^deploy\/k8s\/images\/web\// {print $2, $3}' Dockerfile)
          test "${#mounts[@]}" -gt 0

          check="$RUNNER_TEMP/flirt-web-check.sh"
          sed 's/^exec nginx .*/exit 0/' entrypoint.sh > "$check"
          grep -qx 'exit 0' "$check" || { echo 'entrypoint.sh nu mai are "exec nginx"'; exit 1; }

          # Cu și fără MINIAPP_DOMAIN (gol → santinela `miniapp.localhost`).
          for miniapp in miniapp.ci.invalid ""; do
            docker run --rm --add-host api:127.0.0.1 \
              -e DOMAIN=api.ci.invalid -e ADMIN_DOMAIN=admin.ci.invalid -e MINIAPP_DOMAIN="$miniapp" \
              "${mounts[@]}" \
              -v "$check:/usr/local/bin/flirt-web-check.sh:ro" \
              --entrypoint /bin/sh "$IMAGE" /usr/local/bin/flirt-web-check.sh
          done
          echo "flirt-web: configurația nginx randată e validă ($IMAGE)"

  mobile:
    name: Mobile — typecheck + jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalez dependențele
        # `npm ci` cere package-lock.json; dacă lipsește, cădem pe `npm install`.
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Teste (jest)
        run: npm test -- --ci

  # Frontendul Telegram Mini App (`miniapp/`, Vite). Modelat pe jobul `mobile`,
  # cu o diferență: folderul e creat de alt agent și încă NU există pe toate
  # branch-urile. Un job care ar căuta orbește `miniapp/package.json` ar face CI-ul
  # ROȘU pe branch-uri perfect sănătoase — deci verificăm întâi și, dacă lipsește,
  # sărim peste pași cu un `notice` explicit (jobul rămâne verde, nu „fals verde":
  # în momentul în care folderul apare, toți pașii devin obligatorii).
  miniapp:
    name: Mini App — typecheck + teste + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verific dacă `miniapp/` există pe acest branch
        id: check
        run: |
          if [ -f miniapp/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::miniapp/package.json lipsește pe acest branch — sar peste job."
          fi
          # Cache-ul npm din setup-node EȘUEAZĂ dacă fișierul indicat nu există,
          # deci îl activăm doar când chiar avem lock-file.
          if [ -f miniapp/package-lock.json ]; then
            echo "lock=true" >> "$GITHUB_OUTPUT"
          else
            echo "lock=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
          cache: ${{ steps.check.outputs.lock == 'true' && 'npm' || '' }}
          cache-dependency-path: miniapp/package-lock.json

      - name: Instalez dependențele
        if: steps.check.outputs.exists == 'true'
        working-directory: miniapp
        # `npm ci` cere package-lock.json; dacă lipsește, cădem pe `npm install`.
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck (tsc --noEmit)
        if: steps.check.outputs.exists == 'true'
        working-directory: miniapp
        run: npm run typecheck --if-present

      - name: Teste
        if: steps.check.outputs.exists == 'true'
        working-directory: miniapp
        # `--if-present`: la început `miniapp/` poate să nu aibă încă teste, iar
        # un job roșu din cauza asta ar antrena echipa să ignore CI-ul.
        run: npm run test --if-present

      - name: Build (vite build)
        if: steps.check.outputs.exists == 'true'
        working-directory: miniapp
        run: npm run build
