# Reverse proxy TLS pentru FLIRT — TREI nume publice, UN singur certificat:
#
#   api.flrt.md    → proxy către API-ul FastAPI (containerul `api`)
#   admin-flirt-paty.flrt.md  → build-ul static al panoului de admin (SPA React/Vite)
#   ${MINIAPP_DOMAIN}         → build-ul static al Telegram Mini App (SPA Vite,
#                               folderul `miniapp/`; numele încă nedecis → variabilă)
#
# ┌─ ACEST FIȘIER ESTE UN ȘABLON ────────────────────────────────────────────────┐
# │ `${DOMAIN}`, `${ADMIN_DOMAIN}` și `${MINIAPP_DOMAIN}` sunt înlocuite la       │
# │ pornirea containerului de                                                    │
# │ `nginx/entrypoint.sh` (sed, listă fixă de variabile — restul de `$...` sunt   │
# │ variabile NGINX și rămân neatinse). Fișierul randat ajunge în                 │
# │ /etc/nginx/conf.d/default.conf. Domeniul NU e hardcodat nicăieri: vine din    │
# │ `.env` → docker-compose → container.                                          │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# Certificatele sunt așteptate la căile FIXE de mai jos. Ajung acolo prin
# `nginx/40-ensure-cert.sh` (rulează la pornire și periodic):
#   - producție : symlink către /etc/letsencrypt/live/$DOMAIN/ (Let's Encrypt,
#                 emis automat de serviciul `certbot` pentru TOATE numele setate)
#   - fallback  : certificat SELF-SIGNED generat pe loc (cu toate numele în SAN)
# Nginx NU pornește fără certificat — de aceea scriptul garantează că există unul,
# iar stack-ul pornește din prima chiar dacă Let's Encrypt n-a emis încă nimic.

# AUTO-VINDECARE — de ce NU folosim `upstream { server api:8000; }`.
#
# Nginx rezolvă numele din `upstream` O SINGURĂ DATĂ, la pornire, și memorează IP-ul.
# Când containerul `api` moare și se ridică din nou (crash + `restart: unless-stopped`),
# Docker îi dă un IP NOU. Nginx continuă să trimită traficul la IP-ul VECHI, care nu mai
# există → **502 Bad Gateway PERMANENT**, chiar dacă API-ul e perfect sănătos.
#
# Verificat pe serverul real: după un crash, containerul revenea `healthy` în ~15s, dar
# site-ul rămânea căzut la infinit până la un `nginx -s reload` MANUAL. Adică politica de
# auto-restart era complet inutilă — se ridica procesul, dar nu și serviciul.
#
# Soluția: rezolverul intern al Docker (127.0.0.11) + numele pus într-o VARIABILĂ.
# Când `proxy_pass` primește o variabilă, nginx re-rezolvă numele la fiecare cerere
# (respectând `valid=`), deci preia automat IP-ul nou. Zero intervenție manuală.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# --------------------------------------------------------------------------- #
# TLS — o singură dată, la nivel de `http`; toate serverele de mai jos moștenesc.
# --------------------------------------------------------------------------- #
ssl_certificate     /etc/nginx/certs/fullchain.pem;
ssl_certificate_key /etc/nginx/certs/privkey.pem;

# Doar TLS 1.2/1.3; cifruri moderne cu forward secrecy (ECDHE + AEAD).
# Fără RC4/3DES/CBC-SHA1 și fără TLS 1.0/1.1 (deprecate).
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;   # TLS1.3: clientul alege (recomandarea Mozilla)
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server_tokens off;

# Rate limiting la marginea rețelei (prima linie de apărare, înainte de app).
# Cheia = IP-ul clientului. Zone separate: generală, strictă pt. auth, și una
# pentru panoul de admin (login-ul de admin e o țintă de brute-force).
# `rate` = cereri/secundă susținute; `burst` (în location) = vârf tolerat.
limit_req_zone $binary_remote_addr zone=flirt_general:10m rate=20r/s;

# Cheia de limitare pentru rutele de autentificare. Pentru OPTIONS e GOALĂ, iar
# nginx NU numără cererile cu cheie goală: verificarea preliminară CORS e trimisă
# automat de browser înaintea fiecărei cereri, deci ar consuma degeaba jumătate
# din buget și ar bloca utilizatori legitimi.
map $request_method $flirt_auth_key {
    default  $binary_remote_addr;
    OPTIONS  "";
}

# Login cu parolă: rar și scump de ghicit, deci limită strictă.
limit_req_zone $flirt_auth_key zone=flirt_auth:10m rate=5r/m;

# Autentificarea Telegram e ALTCEVA: Mini App-ul o reface la FIECARE deschidere,
# iar o închidere-redeschidere rapidă e comportament normal, nu atac. Cu 5r/m
# utilizatorii primeau 429, iar răspunsul proxy-ului nu poartă antetele CORS,
# deci browserul arăta „fără conexiune" în loc de o eroare reală. Controlul fin
# rămâne în aplicație, care răspunde corect și cu antetele necesare.
limit_req_zone $flirt_auth_key zone=flirt_tg_auth:10m rate=60r/m;
limit_req_status 429;

# --------------------------------------------------------------------------- #
# :80 — NIMIC nu se servește în clar. Doar provocarea ACME (Let's Encrypt are
# nevoie de HTTP simplu ca să emită/reînnoiască certificatul) și redirect 301.
# Un singur server pe :80 acoperă AMBELE nume (api + admin).
# --------------------------------------------------------------------------- #
server {
    listen 80 default_server;
    server_name _;

    # HTTP-01 challenge (webroot partajat cu serviciul `certbot` din compose).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------- #
# :443 DEFAULT — orice Host care NU e unul dintre numele noastre (scanere care
# lovesc direct IP-ul, Host-header spoofing) primește 444: nginx închide conexiunea
# fără să răspundă nimic. Fără acest bloc, orice nume ar fi servit de primul server
# definit, iar API-ul ar fi accesibil pe IP-ul brut.
# --------------------------------------------------------------------------- #
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    return 444;
}

# --------------------------------------------------------------------------- #
# :443 API — api.flrt.md. Tot traficul aplicației mobile (inclusiv tokenurile
# JWT) trece pe aici.
# --------------------------------------------------------------------------- #
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    client_max_body_size 55m;   # upload foto anketă + video story (50 MB)

    # Securitate de bază
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # HSTS: forțează HTTPS în browser 2 ani, inclusiv subdomenii + preload.
    # Are efect real doar servit peste TLS — adică exact aici.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Liveness + readiness (/health, /health/ready). Fără access log (zgomot).
    location /health {
        # Variabilă (nu upstream): forțează re-rezolvarea DNS → preia IP-ul nou
        # al containerului `api` după un restart, fără reload manual.
        set $flirt_api api:8000;
        proxy_pass http://$flirt_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Endpoint-urile de autentificare: limită strictă (anti brute-force / spam).
    # Acoperă și /api/v1/admin/auth/* dacă panoul de admin își pune login-ul acolo.
    # Potrivire EXACTĂ: are prioritate față de prefixul /api/v1/auth/ de mai jos.
    location = /api/v1/auth/telegram {
        limit_req zone=flirt_tg_auth burst=30 nodelay;

        set $flirt_api_tg api:8000;
        proxy_pass http://$flirt_api_tg;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        limit_req zone=flirt_auth burst=10 nodelay;

        # Variabilă (nu upstream): forțează re-rezolvarea DNS → preia IP-ul nou
        # al containerului `api` după un restart, fără reload manual.
        set $flirt_api api:8000;
        proxy_pass http://$flirt_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Corelarea log-urilor: dacă clientul nu trimite un request-id, îl
        # generăm aici; API-ul îl preia din antet (vezi app/core/logging.py).
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=flirt_general burst=40 nodelay;

        # Variabilă (nu upstream): forțează re-rezolvarea DNS → preia IP-ul nou
        # al containerului `api` după un restart, fără reload manual.
        set $flirt_api api:8000;
        proxy_pass http://$flirt_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }
}

# --------------------------------------------------------------------------- #
# :443 ADMIN — admin-flirt-paty.flrt.md. Servește DOAR fișierele statice ale panoului
# (build Vite), din volumul `admin_dist` populat de serviciul `admin-build`.
#
# Panoul vorbește cu API-ul prin https://${DOMAIN} (cross-origin) — de aceea
# backend-ul are nevoie de CORS_ORIGINS=https://${ADMIN_DOMAIN}. NU proxyăm
# /api/ de aici: o singură origine pentru API înseamnă o singură suprafață de
# rate-limiting, de log-uri și de CORS.
#
# Dacă `admin/` nu există încă în repo (sau build-ul a eșuat), volumul e gol:
# nginx întoarce 404 pe acest nume, dar API-ul funcționează normal. Panoul de
# admin NU poate bloca backend-ul.
# --------------------------------------------------------------------------- #
server {
    listen 443 ssl;
    http2 on;
    server_name ${ADMIN_DOMAIN};

    root /var/www/admin;
    index index.html;

    limit_req zone=flirt_general burst=40 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # CSP pentru un SPA Vite: scripturile sunt fișiere externe (module), stilurile
    # pot fi injectate inline de bundler. `connect-src` permite DOAR API-ul nostru.
    # Dacă panoul are nevoie de altă origine (ex. un CDN de fonturi), relaxeaz-o AICI,
    # explicit — nu global.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://${DOMAIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Asset-urile Vite au hash în nume → cache agresiv, fără revalidare.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html NU se cachează: altfel userul rămâne blocat pe un build vechi
    # care cere asset-uri hash-uite care nu mai există.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Fallback SPA: react-router are rute pe client (/users, /reports...). Fără
    # `try_files ... /index.html`, un refresh (F5) pe o rută internă dă 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --------------------------------------------------------------------------- #
# :443 MINI APP — ${MINIAPP_DOMAIN}. Servește DOAR fișierele statice ale
# Telegram Mini App-ului (build Vite din `miniapp/`), din volumul `miniapp_dist`
# populat de serviciul `miniapp-build`. Ca și panoul de admin, NU proxyează /api/:
# Mini App-ul vorbește cu API-ul pe https://${DOMAIN} (cross-origin) — deci
# backend-ul are nevoie de originea asta în CORS_ORIGINS.
#
# Dacă MINIAPP_DOMAIN nu e (încă) setat în .env, `entrypoint.sh` randează aici
# un nume-santinelă (miniapp.localhost) care nu poate fi rezolvat public: blocul
# rămâne sintactic valid, nginx pornește normal, iar traficul real nu ajunge
# niciodată pe el (orice Host necunoscut cade pe `default_server` → 444).
#
# ⚠️  DE CE CSP-UL DIFERĂ DE CEL AL PANOULUI DE ADMIN:
#   1. `frame-ancestors` — panoul de admin folosește 'none' (nu are voie să fie
#      încadrat NICĂIERI). Un Mini App este, prin definiție, încadrat: clientul
#      web Telegram îl deschide într-un <iframe>. Cu 'none' browserul refuză
#      randarea și userul vede o fereastră goală. Permitem EXACT cele două
#      origini Telegram, nimic mai mult (clienții desktop/mobil folosesc webview
#      nativ, unde frame-ancestors nici nu se aplică).
#   2. `script-src` — SDK-ul oficial (telegram-web-app.js) se încarcă de pe
#      https://telegram.org și NU are voie pus în bundle: Telegram îl schimbă
#      fără preaviz, iar o copie învechită înseamnă initData invalid.
#   3. `img-src https: data:` — avatarele userilor vin de pe domenii Telegram
#      (t.me/cdn-uri care se schimbă), imposibil de enumerat static.
#   4. X-Frame-Options NU e setat pe acest bloc — DENY ar bloca iframe-ul chiar
#      dacă frame-ancestors permite (browserele vechi dau prioritate lui XFO).
#      Antetele de securitate din acest fișier sunt declarate PER SERVER (nu la
#      nivel `http`), iar `add_header` nu se moștenește de la un nivel superior
#      când nivelul curent își declară propriile antete — deci aici nu se poate
#      strecura niciun XFO moștenit. Restul disciplinei (HSTS, nosniff,
#      Referrer-Policy, rate limiting) rămâne identică cu a panoului de admin.
# --------------------------------------------------------------------------- #
server {
    listen 443 ssl;
    http2 on;
    server_name ${MINIAPP_DOMAIN};

    root /var/www/miniapp;
    index index.html;

    limit_req zone=flirt_general burst=40 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https://${DOMAIN}; frame-ancestors https://web.telegram.org https://telegram.org; base-uri 'self'; form-action 'self'" always;

    # Asset-urile Vite au hash în nume → cache agresiv, fără revalidare.
    # `add_header` de aici ar anula antetele de securitate ale serverului (nginx
    # nu le cumulează între niveluri), de aceea le repetăm explicit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    # index.html NU se cachează: Telegram ține Mini App-ul deschis mult timp și
    # un index.html cachat cere asset-uri hash-uite care nu mai există.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https://${DOMAIN}; frame-ancestors https://web.telegram.org https://telegram.org; base-uri 'self'; form-action 'self'" always;
    }

    # Fallback SPA: rutele Mini App-ului sunt pe client; fără `try_files`, un
    # reload (sau un deep-link cu ?tgWebAppStartParam=...) ar da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
