# FLIRT — DOAR DEZVOLTARE LOCALĂ (db + redis + api).
#
# ⛔ PRODUCȚIA NU RULEAZĂ CU DOCKER COMPOSE. Din 28.10.2026 producția rulează pe
#    k3s: `deploy/k8s/scripts/deploy.sh` (runbook: deploy/k8s/scripts/README.md).
#    NU rula `docker compose up` pe server. Ca plasă de siguranță, entrypoint.sh
#    refuză să pornească API-ul cu ENVIRONMENT=production în afara Kubernetes.
#
#   cd backend
#   cp docker-compose.override.example.yml docker-compose.override.yml   # o dată
#   docker compose up --build        # API pe http://localhost:8000 (prin override)
#
# Nu există nginx/TLS/certbot/backup aici — toate astea trăiesc în deploy/k8s/.
# Migrațiile Alembic rulează la pornirea containerului `api` (entrypoint.sh).
# Postgres și Redis NU au `ports:` aici (le publici, dacă ai nevoie, din override —
# vezi exemplul). Variabilele ${...} se citesc din `.env` (vezi `.env.example`).

# Numele proiectului, EXPLICIT și DIFERIT de vechiul stack de producție (`flirt`):
# volumele/containerele de dev nu se pot amesteca cu cele rămase pe server, iar
# un `docker compose down -v` de dev nu poate atinge altceva.
name: flirt-dev

# Rotația log-urilor: fără ea, log-urile JSON umplu discul în tăcere.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    security_opt: [ "no-new-privileges:true" ]
    # FĂRĂ `ports:` implicit: `api` îl atinge prin numele de serviciu `db`. Vrei
    # psql de pe laptop? Publică-l pe 127.0.0.1 din override (vezi exemplul).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flirt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-flirt}
    # `pg_stat_statements` e cerut de migrația a1c4e7f9b2d6 (statistica de
    # query-uri lente) — fără preload, view-ul extensiei dă eroare. Tuning-ul de
    # producție (shared_buffers etc.) e în deploy/k8s/manifests/db.yaml.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flirt}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    security_opt: [ "no-new-privileges:true" ]
    # ⚠️  FĂRĂ `ports:`. Un Redis expus pe internet e preluat în minute (nu are
    # autentificare implicită, iar comenzile CONFIG SET / MODULE LOAD duc direct la
    # execuție de cod pe server). Rămâne în rețeaua internă Docker.
    #
    # PAROLĂ OPȚIONALĂ (apărare în adâncime: orice container compromis din rețeaua
    # internă ar putea altfel citi/scrie liber rate-limit-urile și OTP-urile).
    #   - REDIS_PASSWORD gol/nesetat → Redis pornește ca înainte, FĂRĂ parolă
    #     (un deploy fără variabila nouă nu se rupe);
    #   - REDIS_PASSWORD setat → `--requirepass`, iar REDIS_URL-ul implicit al
    #     API-ului (mai jos) include automat parola.
    # Parola trebuie să fie URL-safe (intră în REDIS_URL): `openssl rand -hex 32`.
    # Dacă ai REDIS_URL explicit în .env, pune parola și acolo:
    #   REDIS_URL=redis://:<parola>@redis:6379/0
    # `$$` = variabila e expandată de shell-ul DIN container, nu de compose.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - 'exec redis-server --save 60 1 $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    volumes:
      - redisdata:/data
    healthcheck:
      # Cu parolă: REDISCLI_AUTH (nu `-a`, care apare în lista de procese și
      # printează un avertisment). Fără parolă NU exportăm variabila: un
      # REDISCLI_AUTH gol ar trimite `AUTH ""` și ar pica verificarea.
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD:-}\" ]; then export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; fi; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    logging: *default-logging
    security_opt: [ "no-new-privileges:true" ]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Rate limiting PARTAJAT între workeri/instanțe (app/core/ratelimit.py) +
      # store OTP live. Fără Redis, limita e per proces × 4 workeri.
      # Cu REDIS_PASSWORD setat (vezi serviciul `redis`), URL-ul implicit devine
      # redis://:<parola>@redis:6379/0; fără el rămâne exact ca înainte.
      REDIS_URL: ${REDIS_URL:-redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `expose` NU publică nimic pe host; portul 8000 îl publică override-ul de dev.
    expose:
      - "8000"
    # Media încărcată (poze/story-uri) cu STORAGE_PROVIDER=local. Volum persistent
    # ca fișierele să supraviețuiască restartului/rebuild-ului containerului.
    volumes:
      - mediadata:/data/media
    # Readiness REAL (SELECT 1 pe DB + PING pe Redis) — nu un 200 static.
    # `start_period` acoperă migrațiile Alembic din entrypoint.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
  mediadata:
  redisdata:
