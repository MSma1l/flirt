# FLIRT — override LOCAL de dezvoltare. Copiază-l în backend/docker-compose.override.yml
# (gitignored); docker compose îl preia AUTOMAT lângă docker-compose.yml.
#
# docker-compose.yml e DOAR pentru dezvoltare (producția = k3s, vezi deploy/k8s/).
# Override-ul publică API-ul pe HTTP :8000 (Swagger + Expo de pe telefonul din
# aceeași rețea). Postgres/Redis rămân nepublicate; decomentează mai jos dacă
# vrei să te conectezi din host — DOAR pe 127.0.0.1.

services:
  api:
    ports:
      - "8000:8000"      # http://<IP-laptop>:8000/docs — Swagger, și tot aici vine Expo

