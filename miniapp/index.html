<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      SDK-ul Telegram trebuie să fie în <head>, ÎNAINTEA bundle-ului: el creează
      `window.Telegram.WebApp`, pe care puntea din `src/telegram/` îl citește la
      pornire. NU e pachet npm și NU intră în bundle — Telegram cere versiunea
      servită de ei, ca aplicația să primească funcțiile clientului curent.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <title>FLIRT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
