# Web = nginx (non-root, :8080): servește static panoul de admin + Mini App-ul,
# /media direct din volum (readOnly) și face proxy /api → api:8000.
# Rutarea pe host (DOMAIN / ADMIN_DOMAIN / MINIAPP_DOMAIN) o face nginx-ul din
# imagine (șablon envsubst); TLS-ul îl termină Traefik.
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      automountServiceAccountToken: false
      # preStop 5s (ieșire din Endpoints) + nginx închide grațios conexiunile la SIGQUIT.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: flirt-web:current
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          # Doar numele publice pentru șablonul nginx — nu tot `.env`-ul (secrete).
          env:
            - name: DOMAIN
              valueFrom:
                secretKeyRef: { name: flirt-env, key: DOMAIN }
            - name: ADMIN_DOMAIN
              valueFrom:
                secretKeyRef: { name: flirt-env, key: ADMIN_DOMAIN }
            - name: MINIAPP_DOMAIN
              valueFrom:
                secretKeyRef: { name: flirt-env, key: MINIAPP_DOMAIN, optional: true }
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Read-only: nginx doar citește media; scrie numai `api`.
            - name: media
              mountPath: /var/www/media
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
            readOnly: true
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
