# Destinația backup-urilor: directorul de pe host /opt/flirt-backups (ca
# BACKUP_HOST_DIR din compose), în afara checkout-ului git și a stocării k3s.
#
# De ce PV static și nu `hostPath` direct în pod: namespace-ul impune Pod Security
# `baseline`, care interzice volumele hostPath în spec-ul pod-ului. Un PV hostPath
# legat explicit de PVC-ul `backups` e permis și ține calea într-un singur loc.
# Retain: ștergerea PVC-ului/namespace-ului NU atinge backup-urile.
# PersistentVolume e resursă de cluster (namespace-ul din kustomization se ignoră).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: flirt-backups
  labels:
    app.kubernetes.io/name: backups
spec:
  storageClassName: ""
  capacity:
    storage: 50Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: flirt
    name: backups
  hostPath:
    path: /opt/flirt-backups
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
  labels:
    app.kubernetes.io/name: backups
spec:
  storageClassName: ""
  volumeName: flirt-backups
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
