# Redis 7 — rate limiting partajat + store OTP. 1 replică, persistență RDB pe PVC.
# Parolă OPȚIONALĂ, exact ca în compose: cheia REDIS_PASSWORD din `flirt-env`
# lipsă/goală → fără parolă; setată → --requirepass (și REDIS_URL trebuie s-o conțină).
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      automountServiceAccountToken: false
      priorityClassName: flirt-data
      terminationGracePeriodSeconds: 30
      securityContext:
        # uid 999 = utilizatorul `redis` din imaginea alpine.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # Aceeași comandă ca în compose. `${...}` NU e expandat de Kubernetes
          # (acesta expandează doar `$(VAR)`), ci de shell-ul din container.
          command:
            - /bin/sh
            - -c
            - 'exec redis-server --save 60 1 ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}'
          workingDir: /data
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: flirt-env, key: REDIS_PASSWORD, optional: true }
          ports:
            - name: redis
              containerPort: 6379
          # Fără parolă NU exportăm REDISCLI_AUTH: un AUTH "" ar pica verificarea.
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "if [ -n \"${REDIS_PASSWORD:-}\" ]; then export REDISCLI_AUTH=\"$REDIS_PASSWORD\"; fi; redis-cli ping | grep -q PONG"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "if [ -n \"${REDIS_PASSWORD:-}\" ]; then export REDISCLI_AUTH=\"$REDIS_PASSWORD\"; fi; redis-cli ping | grep -q PONG"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: redis
      spec:
        storageClassName: local-path-retain
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
