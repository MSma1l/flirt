apiVersion: v1
kind: Namespace
metadata:
  name: flirt
  labels:
    app.kubernetes.io/part-of: flirt
    # Pod Security Admission: `baseline` impus (blochează privileged/hostNetwork),
    # `restricted` doar raportat. Backup-urile ajung la hostPath printr-un PV (backups.yaml).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
