# Proxy către API — inclus în FIECARE `location` care trimite la `api`.
#
# De ce un fișier comun: `proxy_set_header` NU se moștenește într-un location
# care își declară propriile antete, iar o singură linie uitată (ex.
# X-Forwarded-For) ar face aplicația să vadă IP-ul lui nginx pentru toată
# lumea (vezi `app/core/ratelimit.py: client_ip`). Aici e o singură sursă.
proxy_pass http://flirt_api;

# Keepalive către upstream (vezi `upstream flirt_api` din șablon).
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# După `real_ip_*` din șablon, $remote_addr = IP-ul REAL al clientului (nu
# IP-ul podului Traefik) → ultima intrare din listă e clientul, exact ce citește
# aplicația. Spoofing-ul din antetul clientului rămâne în față, ignorat.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# TLS e terminat de Traefik: $scheme aici e mereu „http". Schema reală vine din
# antetul pus de Traefik, filtrat prin map-ul $flirt_fwd_proto (doar http|https).
proxy_set_header X-Forwarded-Proto $flirt_fwd_proto;
# Corelarea log-urilor: request-id generat aici dacă lipsește (app/core/logging.py).
proxy_set_header X-Request-ID $request_id;

proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
