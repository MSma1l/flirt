# nginx.conf principal pentru imaginea flirt-web (k8s, NON-ROOT, uid 101).
#
# Tot ce scrie nginx la rulare stă în /tmp: pid, buffere temporare și configul
# randat din șablon. Astfel containerul merge și cu readOnlyRootFilesystem
# (emptyDir montat pe /tmp). Uploadurile mari (până la 55m, vezi șablonul) se
# bufferează în /tmp/client_temp → emptyDir-ul trebuie să aibă loc pentru ele.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Configul FLIRT (server-ele api / admin / miniapp), randat la pornire de
    # flirt-web-entrypoint.sh din /etc/nginx/flirt/flirt.conf.template.
    include /tmp/nginx/flirt.conf;
}
